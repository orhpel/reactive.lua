site_name: Reactive Documentation
site_url: https://orhpel.github.io/reactive.lua/
repo_url: https://github.com/orhpel/reactive.lua
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue-grey
      accent: blue-grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue-grey
      accent: blue-grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
    
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Guide:
      - Introduction: guide/00-introduction.md
      - Installation: guide/01-installation.md
      - Ref and Effect: guide/02-ref-and-effect.md
      - Computed: guide/03-computed.md
      - Reactive Objects: guide/04-reactive-objects.md
      - Watch: guide/05-watch.md
      - Ref Variants: guide/06-ref-variants.md
      - Reactive Variants: guide/07-reactive-variants.md
      - Effect Scope: guide/08-effect-scope.md
      - Deep Watching: guide/09-deep-watching.md
      - Lua Interop: guide/10-lua-interop.md
      - Iteration Details: guide/11-iteration-details.md
      - Tracking Control: guide/12-tracking-control.md
      - Differences from Vue: guide/90-differences-from-vue.md
  - Reference:
      - Overview: reference/README.md
      - Computed: reference/computed.md
      - Effect: reference/effect.md
      - Reactive: reference/reactive.md
      - Ref: reference/ref.md
      - Scope: reference/scope.md
      - Watch: reference/watch.md
  - Examples:
      - Overview: examples/README.md
      - Reactive Counter: examples/01-reactive-counter.md
      - Shopping Cart: examples/02-shopping-cart.md
      - Config Auto-Reload: examples/03-config-auto-reload.md
      - Game Simulation Tick: examples/04-game-simulation-tick.md
      - Event Bus Replacement: examples/05-event-bus-replacement.md
      - Lazy Derived Graph: examples/06-lazy-derived-graph.md
